services:
  task6:
    build: .
    container_name: shkolkovo-task6
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8086}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
