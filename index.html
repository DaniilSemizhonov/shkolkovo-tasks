}
@media (max-width: 959px) {
  .sb-tape { grid-template-columns: repeat(7,minmax(0,1fr)); }
  .sb-tape > .sb-tape-cell:nth-child(2),
  .sb-tape > .sb-tape-cell:nth-child(10) { display: none; }
}
@media (max-width: 420px) {
  .sb-tape { grid-template-columns: repeat(5,minmax(0,1fr)); }
  .sb-tape > .sb-tape-cell:nth-child(3),
  .sb-tape > .sb-tape-cell:nth-child(9) { display: none; }
}
@media (max-width: 1180px) {
  .sb-app { grid-template-columns: var(--sb-nav-width) minmax(0,1fr); }
  .sb-params { grid-column: 2; position: static; max-height: none; overflow: visible; }
  .sb-grid-3 { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 768px) {
  .sb-app { grid-template-columns: minmax(0,1fr); padding: 12px; gap: 12px; }
  .sb-nav, .sb-main, .sb-params { grid-column: 1; position: static; max-height: none; }
  .sb-nav.sb-card, .sb-card { padding: var(--sb-card-padding-mobile); }
  .sb-hero { padding: var(--sb-hero-padding-mobile); }
  .sb-grid-2, .sb-grid-3 { grid-template-columns: minmax(0,1fr); }
  .sb-grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .sb-controls .sb-btn { flex: 1 1 auto; }
  .sb-logo { max-width: 360px; }
  .sb-section-nav { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 420px) {
  .sb-app { padding: 12px; }
  .sb-grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); }
  /* Если биты кликабельны, 8 штук по 44px не помещаются в iframe 320px. */
  .sb-bit-grid:has(.sb-bit.is-interactive) { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .sb-section-btn { justify-content: center; }
  .sb-stat { padding: 9px; }
  .sb-code { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important;
    animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}


/* === Design System 2.4: утверждённые D14–D21 и компоненты лаборатории №27 ===
   Не изменяет платформенную логику SDK. Действует только если компоненты присутствуют.
   D14-B: Заголовок «Временная шкала» либо «Ход алгоритма» задаётся текстом HTML.
   D15-B: Только две шаговые кнопки могут быть без текста, но с aria-label.
   D16-B: Белые плавающие информационные плашки — исключение только внутри графика.
   D17-A: Метрики на телефоне 2 в ряд, подписи 11–12px.
   D18-B: Инструменты масштаба и статус справа в заголовке сцены.
   D19-B: <picture> с прозрачными light/dark логотипами, без подложки.
   D20-B: Код может сворачиваться в ходе воспроизведения (JS обязан синхронизировать).
   D21-B: Активный шаг с полной 2px рамкой и левой 5px полосой.
*/

/* Заголовок рабочей сцены и контролы масштаба: D18-B */
.sb-scene-head { display:flex; align-items:flex-start; justify-content:space-between;
  flex-wrap:wrap; gap:12px; margin-bottom:16px; min-width:0; }
.sb-scene-head > :first-child { min-width:0; flex:1 1 220px; }
.sb-scene-right { display:flex; flex-direction:column; align-items:flex-end;
  gap:9px; min-width:0; max-width:100%; margin-inline-start:auto; }
.sb-view-zoom { display:flex; flex-wrap:nowrap; align-items:center; gap:5px; max-width:100%; }
.sb-view-zoom .sb-btn { flex:0 0 auto; min-width:44px; min-height:44px;
  border-radius:9px; padding:8px; font-size:14px; }
.sb-view-zoom .sb-view-fit { min-width:74px; padding-inline:10px; }
@media (max-width:640px) { .sb-scene-right{gap:6px;} .sb-view-zoom{gap:4px;} }
@media (max-width:390px) { .sb-scene-right { width:100%; align-items:flex-end; } }

/* D15-B: стрелки только для back и forward. Доступное имя обеспечивает aria-label. */
.sb-playback-actions .sb-btn[data-action="back"].sb-btn--icon,
.sb-playback-actions .sb-btn[data-action="forward"].sb-btn--icon {
  min-width:44px; min-height:44px; width:44px; padding:8px; flex:0 0 44px;
}
@media (max-width:640px) {
  .sb-playback-actions .sb-btn[data-action="back"].sb-btn--icon,
  .sb-playback-actions .sb-btn[data-action="forward"].sb-btn--icon { flex:0 0 44px; }
}

/* D16-B: исключительно перекрывающие график подписи/легенды, остальные L2 — сиреневые. */
.sb-plot-stage { position:relative; min-width:0; }
.sb-plot-overlay { position:absolute; z-index:2; inset:12px auto auto 12px;
  display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; max-width:calc(100% - 24px); pointer-events:none; }
.sb-plot-overlay--right { left:auto; right:12px; justify-content:flex-end; }
.sb-plot-badge { display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:100%;
  padding:6px 9px; border:1px solid var(--sb-border); border-left:4px solid var(--sb-data-color,var(--sb-accent));
  border-radius:9px; background:var(--sb-card); color:var(--sb-text); box-shadow:var(--sb-plot-shadow);
  font:700 13px/1.4 var(--sb-font); overflow-wrap:anywhere; white-space:normal; }
.sb-plot-badge:not([aria-disabled="true"]):is(button,[role="button"]){ pointer-events:auto; min-width:44px; min-height:44px; }
@media (max-width:420px) {
  .sb-plot-overlay{inset:9px auto auto 9px; max-width:calc(100% - 18px); gap:5px; }
  .sb-plot-overlay--right{left:auto;right:9px;}
  .sb-plot-badge{font-size:11px; padding:4px 7px;}
}

/* D17-A: единый компонент метрик; на телефоне не уменьшать подписи до 10px. */
.sb-metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;min-width:0;}
.sb-metric{min-width:0;padding:10px 8px;border-radius:11px;background:var(--sb-surface);}
.sb-metric-value{display:block;font-size:clamp(17px,1.8vw,25px);font-weight:850;
 line-height:1.15;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
.sb-metric-label{display:block;font-size:11px;line-height:1.35;font-weight:700;color:var(--sb-muted);margin-top:5px;}
@media (max-width:768px) {
 .sb-metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
 .sb-metric-label,.sb-stat-label{font-size:11px;}
}

/* D20-B: сворачиваемая панель кода. Само состояние и кадр обслуживает JS. */
.sb-fold{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
 min-width:44px;min-height:44px;padding:6px 0;margin:0 0 12px;border:0;background:transparent;
 color:var(--sb-text);font:800 17px/1.35 var(--sb-font);text-align:left;}
.sb-fold-label{font-size:12px;font-weight:750;color:var(--sb-accent-text);white-space:nowrap;}
.sb-fold-body[hidden]{display:none!important;}
.sb-fold[aria-expanded="false"]{margin-bottom:0;}

/* D21-B: только текущий анимационный шаг; нейтральные callout остаются по D2. */
.sb-step-spotlight{border:2px solid var(--sb-accent);border-left:5px solid var(--sb-action);
 border-radius:12px;background:var(--sb-surface-2);padding:12px 14px;
 color:var(--sb-text);font-size:14px;line-height:1.65;overflow-wrap:anywhere;}
.sb-step-spotlight-label{display:block;font-weight:850;font-size:11px;
 letter-spacing:1px;color:var(--sb-accent-text);margin-bottom:4px;}

/* Новые предметные компоненты №27. Зафиксированы только повторяемые стили. */
.sb-graph { display:block;width:100%;height:auto;max-width:100%;aspect-ratio:720/430;touch-action:none;user-select:none; }
.sb-graph .sb-point { cursor:pointer; }
.sb-graph:focus-visible{outline:2px solid var(--sb-accent);outline-offset:2px;}
.sb-plot-caption { display:flex;align-items:center;justify-content:space-between;
 flex-wrap:wrap;gap:9px;margin-top:10px;font-size:12px;color:var(--sb-muted);}
.sb-energy-axis { margin-top:12px; padding:12px; border:1px solid var(--sb-border);
 background:var(--sb-surface);border-radius:12px;box-shadow:none;min-width:0; }
.sb-energy-objects{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:13px;}
.sb-energy-objects > button{min-height:44px;min-width:44px;max-width:100%;border:1px solid var(--sb-border);
 border-left:4px solid var(--sb-data-color,var(--sb-accent));background:var(--sb-surface);
 color:var(--sb-text);border-radius:9px;padding:8px 6px;font-size:12px;}
@media (max-width:768px) { .sb-energy-axis{padding:10px;} }
@media (max-width:420px) {
  .sb-energy-objects{grid-template-columns:repeat(3,minmax(0,1fr));}
  .sb-plot-caption{align-items:flex-start;flex-direction:column;}
}
.sb-quiz-feedback{border-left:4px solid var(--sb-warning);border-radius:0 9px 9px 0;
 padding:12px 14px;background:var(--sb-warning-surface);color:var(--sb-warning-text);
 font-size:13px;line-height:1.55;overflow-wrap:anywhere;}
.sb-quiz-feedback.is-success{border-left-color:var(--sb-success);background:var(--sb-success-surface);color:var(--sb-success-text);}
.sb-quiz-feedback.is-error{border-left-color:var(--sb-error);background:var(--sb-error-surface);color:var(--sb-error-text);}

 if(a==='clear-marks'){state[state.section].marks=[];state[state.section].checked=false;state[state.section].reveal=false;rerenderSection();persist();return;}
 if(a==='apply-program'){try{M.simulate(state.turtle.draft,state.turtle.heading);state.turtle.source=state.turtle.draft;state.turtle.step=0;stop(false);rerenderSection();persist();}catch(e){$('program-error').innerHTML=fb(e.message,false);}return;}
 if(['back','forward','rewind','finish','cycle'].includes(a)){const w=activeWork(),sim=activeSim();let step=a==='back'?w.step-1:a==='forward'?w.step+1:a==='rewind'?0:sim.frames.length-1;if(a==='cycle'){const now=sim.frames[w.step].context.join('|');const next=sim.frames.findIndex((f,i)=>i>w.step&&f.context.join('|')!==now);step=next<0?sim.frames.length-1:next;}move(step);return;}
 if(a==='play'){if(playTimer){stop();refreshPlayback();}else play();return;}
 if(a==='speed'){const playing=!!playTimer;stop(false);state.speed=+v;if(playing)play();else refreshPlayback();persist();return;}
 if(a==='hint'){examWork().hint=Math.min(3,examWork().hint+1);renderExam();persist();return;}
 if(a==='reset'){$('reset-confirm').hidden=false;return;}if(a==='reset-no'){$('reset-confirm').hidden=true;return;}
 if(a==='reset-yes'){stop(false);const id=state.section;state[id]=INITIAL()[id];render();persist();}
});
$('app').addEventListener('change',event=>{
 if(loading)return;const e=event.target,k=e.dataset.key,v=e.value;if(!k)return;stop(false);zoom=1;
 if(['bx','by'].includes(k)){const n=Number(v);if(!Number.isInteger(n)||n< -2||n>8){e.setCustomValidity('Введите целое число от −2 до 8.');e.reportValidity();return;}e.setCustomValidity('');state.regions[k]=n;state.regions.marks=[];state.regions.checked=false;state.regions.reveal=false;}
 if(k==='turtle-preset'){const p=M.PRESETS[v];Object.assign(state.turtle,{preset:v,source:p.source,draft:p.source,heading:p.heading,step:0});}
 if(k==='heading'){state.turtle.heading=+v;state.turtle.step=0;}
 if(k==='point-preset')state.points.preset=v;if(k==='point-op')state.points.op=v;if(k==='boundary')state.points.boundary=e.checked;
 if(['point-preset','point-op','boundary'].includes(k)){state.points.marks=[];state.points.checked=false;state.points.reveal=false;}
 if(k==='measure-preset'){state.measure.preset=v;state.measure.op='intersection';}if(k==='measure-kind'){state.measure.kind=v;if(v==='perimeter')state.measure.op='intersection';}if(k==='measure-op')state.measure.op=v;if(k.startsWith('measure-')){state.measure.checked=false;state.measure.answer='';}
 if(k==='exam-id')state.exam.id=v;rerenderSection();persist();
});
$('app').addEventListener('input',event=>{
 if(loading)return;const e=event.target;if(e.id==='timeline'){move(+e.value,true);return;}
 if(e.id==='program'){state.turtle.draft=e.value.replace(/\u0000/g,'').slice(0,5000);persist(true);}
 if(e.id==='answer'){const w=state.section==='measure'?state.measure:examWork();w.answer=clean(e.value);w.checked=false;persist(true);}
});
$('app').addEventListener('submit',event=>{
 event.preventDefault();if(loading)return;const form=event.target;
 if(form.id==='answer-form'){const w=state.section==='measure'?state.measure:examWork();if(answerNumber(w.answer)===null){$('answer-error').innerHTML=fb('Введите неотрицательное число. Например, 24 или 25,456.',false);return;}w.checked=true;if(state.section==='exam'){stop(false);w.step=activeSim().frames.length-1;}rerenderSection();persist();}
 if(['cell-form','point-form'].includes(form.id)){const data=new FormData(form),x=Number(data.get('x')),y=Number(data.get('y'));if(!Number.isInteger(x)||!Number.isInteger(y)||Math.abs(x)>100||Math.abs(y)>100)return;if(form.id==='cell-form'){const b=M.bounds(pair());if(x<b.x0||x>=b.x1||y<b.y0||y>=b.y1){form.insertAdjacentHTML('beforeend',fb('Выберите клетку в пределах показанной сетки.',false));return;}toggleMark(x+','+y);}else{state.points.probe={x,y};toggleMark(x+','+y);}rerenderSection();persist();}
});
$('plot').addEventListener('click',event=>{
 if(loading||!view)return;const svg=$('plot').querySelector('svg'),ctm=svg.getScreenCTM();if(!ctm)return;const p=new DOMPoint(event.clientX,event.clientY).matrixTransform(ctm.inverse());const x=(p.x-view.W/2)/view.scale+view.cx,y=(view.H/2-p.y)/view.scale+view.cy;
 if(state.section==='regions'){if(x<view.b.x0||x>=view.b.x1||y<view.b.y0||y>=view.b.y1)return;toggleMark(Math.floor(x)+','+Math.floor(y));renderRegions();persist();}
 if(state.section==='points'){const point={x:Math.round(x),y:Math.round(y)};state.points.probe=point;toggleMark(key(point));renderPoints();persist();}
 if(state.section==='exam'){const w=examWork(),{e,sim,faces}=examModel();if(w.step!==sim.frames.length-1)return;if(e.kind==='faces'){const i=faces.findIndex(poly=>M.locate({x,y},poly)!=='outside');if(i>=0){toggleMark(i+',0');renderExam();persist();}}else if(e.kind==='points'){toggleMark(Math.round(x)+','+Math.round(y));renderExam();persist();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playTimer){stop();refreshPlayback();}});
render();load();

</script>
</body></html>
